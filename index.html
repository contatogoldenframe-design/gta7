<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA 7 — BRASIL</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  body { background:#05070f; overflow:hidden; color:#dfe6ff; }
  canvas { display:block; }

  #menu {
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:
      radial-gradient(ellipse at 30% 20%, #10203f 0%, #05070f 60%);
  }
  #menu h1 { font-size:54px; letter-spacing:4px; color:#8df5ff; text-shadow:0 0 25px #00e5ff, 0 0 60px #004cff; }
  #menu h1 span { color:#ffc93c; text-shadow:0 0 25px #ff9d00; }
  #menu h2 { font-size:15px; color:#7fa8d8; margin-top:4px; letter-spacing:8px; }
  .painel { background:rgba(10,18,38,.85); border:1px solid #1d3a6b; border-radius:10px; padding:24px 30px; margin-top:26px; width:460px; }
  .painel label { display:block; font-size:12px; color:#7fa8d8; margin:12px 0 4px; letter-spacing:2px; }
  .painel select { width:100%; background:#0a1226; color:#dfe6ff; border:1px solid #23416f; padding:10px; border-radius:6px; font-size:15px; }
  #btnIniciar {
    margin-top:20px; width:100%; padding:14px; font-size:18px; font-weight:bold; letter-spacing:3px;
    background:linear-gradient(90deg,#00c6ff,#0072ff); color:#fff; border:0; border-radius:8px; cursor:pointer;
    box-shadow:0 0 20px #0072ff88; transition:.2s;
  }
  #btnIniciar:hover { transform:scale(1.03); box-shadow:0 0 35px #00c6ffaa; }
  #btnIniciar:disabled { opacity:.4; cursor:wait; }
  #infoClima { font-size:12px; color:#8df5ff; margin-top:12px; text-align:center; min-height:16px; }
  #dica { font-size:11px; color:#48638f; margin-top:14px; text-align:center; }

  #hud { position:fixed; inset:0; z-index:10; pointer-events:none; display:none; }
  .hudTop { position:absolute; top:14px; left:14px; background:rgba(5,10,25,.62); padding:10px 14px; border-radius:8px; border:1px solid #1d3a6b; font-size:15px; line-height:1.7; }
  .hudTop b { color:#8df5ff; }
  #estrelas { color:#ffc93c; font-size:17px; letter-spacing:3px; }
  .hudDir { position:absolute; top:14px; right:14px; text-align:right; background:rgba(5,10,25,.62); padding:10px 14px; border-radius:8px; border:1px solid #1d3a6b; font-size:14px; }
  .hudDir .g { font-size:22px; font-weight:bold; color:#8df5ff; }
  .hudDir .w { color:#9ab6e2; font-size:13px; margin-top:2px; }
  .hudBottom { position:absolute; bottom:16px; right:16px; background:rgba(5,10,25,.62); padding:8px 16px; border-radius:8px; text-align:right; }
  #vel { font-size:34px; font-weight:bold; color:#ffc93c; font-variant-numeric:tabular-nums; }
  #nitro { color:#8df5ff; font-size:12px; margin-top:2px; }
  #objMissao { position:absolute; top:16px; left:50%; transform:translateX(-50%); background:rgba(5,10,25,.7); padding:8px 18px; border-radius:8px; border:1px solid #3f7fbf; font-size:14px; text-align:center; display:none; }
  #objMissao b { color:#ffc93c; }
  #toast { position:absolute; bottom:90px; left:50%; transform:translateX(-50%); font-size:17px; text-align:center; color:#fff; text-shadow:0 0 12px #000; transition:opacity .4s; opacity:0; }
  #avisoA { position:absolute; bottom:120px; left:50%; transform:translateX(-50%); font-size:22px; color:#8df5ff; letter-spacing:3px; text-shadow:0 0 20px #00e5ff; display:none; }
  #cross { position:absolute; top:50%; left:50%; margin:-6px 0 0 -6px; width:12px; height:12px; border:1px solid #fff8; border-radius:50%; display:none; }

  #radar { position:absolute; bottom:16px; left:16px; border-radius:8px; border:1px solid #1d3a6b; background:rgba(5,10,25,.55); }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; z-index:30; pointer-events:none; }
  #fade { position:fixed; inset:0; background:#000; opacity:0; z-index:40; pointer-events:none; transition:opacity .9s; }
  #loading { position:fixed; inset:0; z-index:45; background:#02040a; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:18px; letter-spacing:2px; color:#8df5ff; display:none; }
  #loading .sp { width:46px; height:46px; border:4px solid #1d3a6b; border-top-color:#00e5ff; border-radius:50%; animation:gir 1s linear infinite; margin-bottom:18px; }
  @keyframes gir { to { transform:rotate(360deg); } }

  #mapa { position:fixed; inset:0; z-index:60; background:rgba(2,5,14,.96); display:none; flex-direction:column; align-items:center; justify-content:center; }
